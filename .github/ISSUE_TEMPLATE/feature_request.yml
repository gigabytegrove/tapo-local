name: Feature or device support request
description: Suggest an improvement or device capability
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes: {label: Problem or unsupported capability}
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes: {label: Proposed behavior}
    validations: {required: true}
  - type: input
    id: device
    attributes: {label: Device model / firmware if applicable}
