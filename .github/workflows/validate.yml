name: Validate

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install backend dependency
        run: python -m pip install "python-kasa[speedups]==0.10.2"
      - name: Compile integration
        run: python -m compileall -q custom_components/tapo_local
      - name: Validate manifest JSON
        run: python -m json.tool custom_components/tapo_local/manifest.json >/dev/null
      - name: Run backend tests
        run: python -m unittest discover -s tests -v
